version: "3.9"

services:
  # ============================
  # PostgreSQL + TimescaleDB
  # ============================
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: osspulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ============================
  # Redis (Cache + Pub/Sub + BullMQ)
  # ============================
  redis:
    image: redis:7-alpine
    container_name: osspulse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================
  # Backend API (Fastify + Socket.io + BullMQ)
  # ============================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: osspulse-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src:ro
    command: npm run dev

  # ============================
  # AI Service (FastAPI + Prophet)
  # ============================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: osspulse-ai
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./ai-service/app:/app/app:ro

  # ============================
  # Frontend (React + Vite)
  # ============================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: osspulse-frontend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/index.html:/app/index.html:ro
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: osspulse-network
